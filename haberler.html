<!DOCTYPE html>
<html lang="tr">
<head>

  <!-- SEO & Social -->
  <link rel="canonical" href="https://ahmetatakanokutann.github.io/bilisimYapayZeka/haberler.html">
  <meta property="og:title" content="Haberler & Duyurular | Yeditepe AI">

  <meta property="og:image" content="https://ahmetatakanokutann.github.io/bilisimYapayZeka/assets/img/opening-event.jpg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-[--c-bg] text-[--c-text] flex flex-col min-h-screen">

  <!-- Shared Header -->
  <div id="site-header"></div>

  <!-- Main Content -->
  <main class="flex-grow">
    
    <!-- List View Wrapper -->
    <div id="news-list-view">
      <section class="dark-section py-20 md:py-32">
        <div class="container text-center">
          <h1 class="text-4xl md:text-6xl mb-6">
            <span class="gradient-text" data-i18n="nav_news">Haberler & Duyurular</span>
          </h1>
          <p class="text-xl text-[--c-on-dark] opacity-90 max-w-3xl mx-auto leading-relaxed" data-i18n="news_intro">
            Merkezimizdeki teknolojik gelişmeler, etkinlikler ve akademik başarılarımızı buradan takip edebilirsiniz.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div id="news-page-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
            <!-- Dynamically filled -->
          </div>
        </div>
      </section>
    </div>

    <!-- Detail View Wrapper (Hidden by default) -->
    <div id="news-detail-view" class="hidden">
      <section class="section !pb-0">
        <div class="container">
          <a href="haberler.html" class="inline-flex items-center gap-2 text-[--c-accent] font-medium hover:gap-4 transition-all mb-12">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
            <span data-i18n="back_to_news">Haberlere Dön</span>
          </a>
          <div id="news-detail-content" class="max-w-4xl mx-auto">
            <!-- Dynamically filled -->
          </div>
        </div>
      </section>
    </div>

  </main>

  <!-- Shared Footer -->
  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/components.js" defer></script>
  <script src="assets/js/render.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
